name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv

      - name: Cache de Buildozer (acelera compilaciones futuras)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Compilar APK (debug)
        run: buildozer -v android debug

      - name: Subir la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: inventario-cosmeticos-apk
          path: bin/*.apk
          if-no-files-found: error
